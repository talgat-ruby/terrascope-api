[project]
name = "terrascope-core2"
version = "0.1.0"
description = "Terrascope core2 — per-process pipeline (experimental)"
requires-python = ">=3.14"
dependencies = [
    "terrascope-core",
    "numpy>=1.26",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "huggingface_hub>=0.23",
    "segment-anything>=1.0",
    "torch>=2.2",
    "transformers>=4.41",
    "pillow>=10.0",
    "scipy>=1.11",
    "rtree>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core2"]
