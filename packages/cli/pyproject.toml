[project]
name = "terrascope-cli"
version = "0.1.0"
description = "Terrascope cli — per-process pipeline (experimental)"
requires-python = ">=3.14"
dependencies = [
    "terrascope-core",
    "terrascope-core",
    "typer>=0.12",
    "shapely>=2.0",
]

[project.scripts]
terrascope = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
