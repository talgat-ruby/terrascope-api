[project]
name = "terrascope-core"
version = "0.1.0"
description = "Terrascope core — per-process pipeline (experimental)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pydantic>=2.6",
    "huggingface_hub>=0.23",
    "segment-anything>=1.0",
    "segmentation-models-pytorch>=0.3",
    "torch>=2.2",
    "transformers>=4.41",
    "pillow>=10.0",
    "scipy>=1.11",
    "rtree>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
