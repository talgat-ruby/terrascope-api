[project]
name = "terrascope"
version = "0.1.0"
description = "Satellite imagery analysis: object detection and GIS layer generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1",
    "terrascope-core",
    "terrascope-cli",
]

[tool.uv.sources]
terrascope-core = { workspace = true }
terrascope-cli = { workspace = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["packages/core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
